<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- 背景角丸スクエア -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="128" fill="url(#glowGrad)" />

  <!-- 台本（本）と音声のアイコン -->
  <g transform="translate(96, 96) scale(0.625)" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- 本の形状 -->
    <path d="M64 416c35.3 0 64-28.7 64-64V96c-35.3 0-64 28.7-64 64v256z" fill="#ffffff" fill-opacity="0.2" />
    <path d="M448 416c-35.3 0-64-28.7-64-64V96c35.3 0 64 28.7 64 64v256z" fill="#ffffff" fill-opacity="0.2" />
    <path d="M128 352c64-32 128 0 128 0v-256s-64-32-128 0v256z" />
    <path d="M384 352c-64-32-128 0-128 0v-256s64-32 128 0v256z" />
    
    <!-- 中央の光る星・マイクモチーフ -->
    <circle cx="256" cy="180" r="32" fill="#fde047" stroke="#ffffff" stroke-width="12" />
    <path d="M256 224v48" stroke="#fde047" stroke-width="16" />
    <path d="M232 272h48" stroke="#fde047" stroke-width="16" />
  </g>
</svg>
